[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/gsigmad/skill_bundle/**/*.md",
    "src/gsigmad/skill_bundle/**/*.yaml",
    "skills/**/*.md",
    "skills/**/*.yaml",
    "docs/**/*.md",
    "specs/**/*.yaml",
    "npm/**",
    "homebrew/**",
]

[project]
name = "gsigmad"
version = "1.1.0"
description = "Science governance CLI -- deterministic guardrails for probabilistic AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Biobitworks" },
]
keywords = [
    "science",
    "governance",
    "reproducibility",
    "agent-skills",
    "preregistration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "statsmodels>=0.14.5",
    "scipy>=1.16.3",
    "pyyaml>=6.0",
    "pydantic>=2.12.4",
    "rfc8785>=0.1.4",
    "requests",
    "tiktoken>=0.12",
    "rich>=13.0",
    "typer>=0.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
ml = ["pingouin", "lifelines", "scikit-posthocs", "pymc", "arviz"]
kg = ["python-arango>=8.3"]
mcp = ["fastmcp>=3.2"]
dev = ["pytest>=8.0", "pytest-timeout"]
all = ["gsigmad[ml,kg,mcp,dev]"]

[project.scripts]
gsigmad = "gsigmad.cli:app"

[project.urls]
Homepage = "https://github.com/biobitworks/gsigmad"
Repository = "https://github.com/biobitworks/gsigmad"
Issues = "https://github.com/biobitworks/gsigmad/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gsigmad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
python_files = "test_*.py"
python_functions = "test_*"
